<template>
    <lightning-card title="Customers">
        <div class="slds-p-around_medium">
            <!-- New Customer Button -->
            <lightning-button
                label="New Customer"
                variant="brand"
                onclick={openModal}>
            </lightning-button>
        </div>

        <!-- Customer Datatable -->
        <template if:true={customers}>
            <lightning-datatable
                key-field="Id"
                data={customers}
                columns={columns}
                hide-checkbox-column
                onrowaction={handleRowAction}>
            </lightning-datatable>
        </template>
    </lightning-card>

    <!-- ============================= -->
    <!-- New Customer Modal -->
    <!-- ============================= -->
    <template if:true={isModalOpen}>
        <section
            role="dialog"
            tabindex="-1"
            aria-modal="true"
            aria-labelledby="modal-heading"
            class="slds-modal slds-fade-in-open">

            <div class="slds-modal__container">
                <!-- Modal Header -->
                <header class="slds-modal__header">
                    <h2 id="modal-heading" class="slds-text-heading_medium">
                        {modalTitle}
                    </h2>
                </header>

                <!-- Modal Body -->
                <div class="slds-modal__content slds-p-around_medium">
                    <!-- Name -->
                    <lightning-input
                        label="Name"
                        name="Name"
                        value={customerName}
                        onchange={handleChange}
                        required>
                    </lightning-input>

                    <!-- Phone -->
                    <lightning-input
                        type="tel"
                        label="Phone"
                        name="Phone__c"
                        value={phone}
                        onchange={handleChange}>
                    </lightning-input>

                    <!-- Email -->
                    <lightning-input
                        type="email"
                        label="Email"
                        name="Email__c"
                        value={email}
                        onchange={handleChange}>
                    </lightning-input>

                    <!-- Address -->
                    <lightning-input
                        type="text"
                        label="Address"
                        name="Address__c"
                        value={address}
                        onchange={handleChange}>
                    </lightning-input>

                    <!-- Medical History -->
                    <lightning-textarea
                        label="Medical History"
                        name="Medical_History_Notes__c"
                        value={medicalHistory}
                        onchange={handleChange}>
                    </lightning-textarea>
                </div>

                <!-- Modal Footer -->
                <footer class="slds-modal__footer">
                    <lightning-button
                        label="Cancel"
                        onclick={closeModal}>
                    </lightning-button>

                    <lightning-button
                        class="slds-m-left_small"
                        label="Save"
                        variant="brand"
                        onclick={handleSave}>
                    </lightning-button>
                </footer>
            </div>
        </section>

        <!-- Modal Backdrop -->
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
