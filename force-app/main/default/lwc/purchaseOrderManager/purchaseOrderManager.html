<template>

    <lightning-card title="Purchase Orders">

        <!-- New Purchase Order Button -->
        <div class="slds-p-horizontal_medium slds-p-bottom_small">

            <lightning-button
                label="New Purchase Order"
                variant="brand"
                onclick={openModal}>
            </lightning-button>

        </div>


        <!-- Purchase Order Datatable -->
        <lightning-datatable
            key-field="Id"
            data={data}
            columns={columns}
            onrowaction={handleRowAction}>
        </lightning-datatable>

    </lightning-card>


    <!-- Modal -->
    <template if:true={isModalOpen}>

        <section
            role="dialog"
            tabindex="-1"
            aria-modal="true"
            aria-labelledby="modal-heading"
            class="slds-modal slds-fade-in-open">

            <div class="slds-modal__container">


                <!-- Modal Header -->
                <header class="slds-modal__header">

                    <h2
                        id="modal-heading"
                        class="slds-text-heading_medium">

                        New Purchase Order

                    </h2>

                </header>


                <!-- Modal Body -->
                <div class="slds-modal__content slds-p-around_medium">


                    <!-- Supplier -->
                    <lightning-record-picker
                        label="Supplier"
                        name="supplier"
                        object-api-name="Supplier__c"
                        value={supplierId}
                        placeholder="Search Supplier"
                        onchange={handleInputChange}>
                    </lightning-record-picker>


                    <!-- Order Date -->
                    <lightning-input
                        class="slds-m-top_medium"
                        type="datetime"
                        label="Order Date"
                        name="orderDate"
                        value={orderDate}
                        onchange={handleInputChange}>
                    </lightning-input>


                    <!-- Status -->
                    <lightning-combobox
                        class="slds-m-top_medium"
                        label="Status"
                        name="purchaseStatus"
                        value={selectedStatus}
                        options={statusOptions}
                        onchange={handleInputChange}>
                    </lightning-combobox>


                </div>


                <!-- Modal Footer -->
                <footer class="slds-modal__footer">

                    <lightning-button
                        label="Cancel"
                        onclick={closeModal}>
                    </lightning-button>

                    <lightning-button
                        class="slds-m-left_small"
                        label="Save"
                        variant="brand"
                        onclick={handleSave}>
                    </lightning-button>

                </footer>


            </div>

        </section>


        <!-- Modal Backdrop -->
        <div class="slds-backdrop slds-backdrop_open"></div>

    </template>

</template>
