<template>
    <!-- Sales Order Header Card -->
    <lightning-card title="Sales Order Detail" icon-name="standard:orders">
        <template if:true={salesOrder}>
            <div class="slds-p-around_medium slds-grid slds-wrap">
                <div class="slds-col slds-size_1-of-2 slds-p-bottom_small">
                    <strong>Order Name:</strong> {salesOrder.Name}
                </div>
                <div class="slds-col slds-size_1-of-2 slds-p-bottom_small">
                    <strong>Customer:</strong> {customerName}
                </div>
                <div class="slds-col slds-size_1-of-2 slds-p-bottom_small">
                    <strong>Status:</strong> {salesOrder.Status__c}
                </div>
                <div class="slds-col slds-size_1-of-2 slds-p-bottom_small">
                    <strong>Payment Status:</strong> {salesOrder.Payment_Status__c}
                </div>
                <div class="slds-col slds-size_1-of-2">
                    <strong>Total Amount:</strong>
                    <lightning-formatted-number value={salesOrder.Total_Amount__c} format-style="currency"></lightning-formatted-number>
                </div>
            </div>
        </template>
    </lightning-card>

    <!-- Sales Order Line Items Card -->
    <div class="slds-p-around_medium slds-m-top_medium slds-card">
        <div class="slds-grid slds-grid_align-spread slds-m-bottom_small">
            <h2 class="slds-text-heading_medium">Sales Order Line Items</h2>
            <lightning-button
                label="New"
                variant="brand"
                onclick={handleNewLineItem}>
            </lightning-button>
        </div>

        <!-- Line Items Table -->
        <template if:true={hasLineItems}>
            <lightning-datatable
                key-field="Id"
                data={lineItems}
                columns={lineItemColumns}
                hide-checkbox-column>
            </lightning-datatable>
        </template>

        <!-- Empty State -->
        <template if:false={hasLineItems}>
            <p class="slds-text-align_center slds-text-color_weak slds-p-around_medium">
                No line items attached to this order yet.
            </p>
        </template>
    </div>

    <!-- Multi-Item Line Item Modal -->
    <template if:true={isModalOpen}>
        <c-sales-order-line-item
            sales-order-id={recordId}
            onsaved={handleLineItemsSaved}
            onclose={closeModal}>
        </c-sales-order-line-item>
    </template>
</template>
