<template>
    <section
        role="dialog"
        tabindex="-1"
        aria-modal="true"
        class="slds-modal slds-fade-in-open"
    >
        <div class="slds-modal__container">

            <!-- Modal Header -->
            <header class="slds-modal__header">
                <button
                    class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                    title="Close"
                    onclick={closeModal}
                >
                    <lightning-icon
                        icon-name="utility:close"
                        alternative-text="close"
                        size="small"
                    ></lightning-icon>

                    <span class="slds-assistive-text">Close</span>
                </button>

                <h2 class="slds-modal__title slds-hyphenate">
                    Purchase Order Line Items
                </h2>
            </header>

            <!-- Modal Body -->
<div class="slds-modal__content slds-p-around_medium">

    <template for:each={items} for:item="item" for:index="index">

        <div
            key={item.key}
            class="slds-grid slds-gutters slds-m-bottom_small"
        >

            <!-- Product -->
            <div class="slds-col slds-size_5-of-12">
                <lightning-record-picker
                    label="Medicine / Product"
                    name="product"
                    data-index={index}
                    object-api-name="Product2"
                    value={item.Product__c}
                    onchange={handleRowChange}>
                </lightning-record-picker>
            </div>

            <!-- Quantity -->
            <div class="slds-col slds-size_3-of-12">
                <lightning-input
                    type="number"
                    label="Quantity"
                    name="quantity"
                    data-index={index}
                    value={item.Quantity__c}
                    min="1"
                    onchange={handleRowChange}>
                </lightning-input>
            </div>

            <!-- Unit Price -->
            <div class="slds-col slds-size_3-of-12">
                <lightning-input
                    type="number"
                    label="Unit Price"
                    name="unitPrice"
                    data-index={index}
                    value={item.Unit_Price__c}
                    formatter="currency"
                    step="0.01"
                    onchange={handleRowChange}>
                </lightning-input>
            </div>
            <div class="slds-col slds-size_1-of-12 slds-m-top_medium">
                            <lightning-button-icon
                                icon-name="utility:delete"
                                alternative-text="Delete Row"
                                data-index={index}
                                onclick={handleRemoveRow}
                                disabled={isOnlyOneRow}>
                            </lightning-button-icon>
                        </div>

        </div>

    </template>

    <lightning-button
        variant="neutral"
        label="Add Line Item"
        onclick={addLineItem}
    ></lightning-button>

</div>

            <!-- Modal Footer -->
            <footer class="slds-modal__footer">

                <lightning-button
                    label="Cancel"
                    onclick={closeModal}
                ></lightning-button>

                <lightning-button
                    variant="brand"
                    label="Save"
                    onclick={handleSave}
                ></lightning-button>

            </footer>

        </div>
    </section>

    <!-- Backdrop -->
    <div
        class="slds-backdrop slds-backdrop_open"
        role="presentation"
    ></div>
</template>
