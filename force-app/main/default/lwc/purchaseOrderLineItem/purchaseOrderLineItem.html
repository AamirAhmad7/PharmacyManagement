<template>
    <section
        role="dialog"
        tabindex="-1"
        aria-modal="true"
        class="slds-modal slds-fade-in-open"
    >
        <div class="slds-modal__container">

            <!-- Modal Header -->
            <header class="slds-modal__header">
                <button
                    class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                    title="Close"
                    onclick={closeModal}
                >
                    <lightning-icon
                        icon-name="utility:close"
                        alternative-text="close"
                        size="small"
                    ></lightning-icon>

                    <span class="slds-assistive-text">Close</span>
                </button>

                <h2 class="slds-modal__title slds-hyphenate">
                    Purchase Order Line Items
                </h2>
            </header>

            <!-- Modal Body -->
            <div class="slds-modal__content slds-p-around_medium">

                <template for:each={items} for:item="item">
                    <div key={item.key} class="slds-m-bottom_small">

                        <h2>Modal Body</h2>

                    </div>
                </template>

            </div>

            <!-- Modal Footer -->
            <footer class="slds-modal__footer">

                <lightning-button
                    label="Cancel"
                    onclick={closeModal}
                ></lightning-button>

                <lightning-button
                    variant="brand"
                    label="Save"
                    onclick={handleSave}
                ></lightning-button>

            </footer>

        </div>
    </section>

    <!-- Backdrop -->
    <div
        class="slds-backdrop slds-backdrop_open"
        role="presentation"
    ></div>
</template>
