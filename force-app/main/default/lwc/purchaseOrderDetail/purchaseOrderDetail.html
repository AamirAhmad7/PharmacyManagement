<template>
    <!-- Sales Order Header Card -->
    <lightning-card title="Sales Order Detail" icon-name="standard:orders">
        <template if:true={data}>
            <div class="slds-p-around_medium slds-grid slds-wrap">
                <div class="slds-col slds-size_1-of-2 slds-p-bottom_small">
                    <strong>Order Name:</strong> {data.Name}
                </div>
                <div class="slds-col slds-size_1-of-2 slds-p-bottom_small">
                    <strong>Customer:</strong> {supplierName}
                </div>
                <div class="slds-col slds-size_1-of-2 slds-p-bottom_small">
                    <strong>Status:</strong> {data.Status__c}
                </div>
                <!-- <div class="slds-col slds-size_1-of-2 slds-p-bottom_small">
                    <strong>Date :</strong> {data.Order_Date__c}
                </div> -->
                <div class="slds-col slds-size_1-of-2">
                    <strong>Total Amount:</strong>
                    <lightning-formatted-number value={data.Total_Cost__c} format-style="currency"></lightning-formatted-number>
                </div>
            </div>
        </template>
    </lightning-card>

    <!-- Purchase Order Line Items Card -->
    <lightning-card title="Purchase Order Line items">
        <div class="slds-p-around_medium slds-m-top_medium slds-card">
            <div class="slds-grid slds-grid_align-spread slds-m-bottom_small">
                <lightning-button
                    label="New"
                    variant="brand"
                    onclick={handleNewLineItem}>
                </lightning-button>
            </div>
        </div> <!-- ✅ Added missing closing div here -->
    </lightning-card>

    <template if:true={isModalOpen}>
        <c-purchase-order-line-item 
        purchase-order-id={recordId}
        onclose={closeModal}>
    </c-purchase-order-line-item>
    </template>
</template>
