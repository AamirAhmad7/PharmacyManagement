
<template>
    <!-- Purchase Order Header Card -->
    <lightning-card
        title="Purchase Order Detail"
        icon-name="standard:orders">

        <template if:true={data}>
            <div class="slds-p-around_medium slds-grid slds-wrap">

                <div class="slds-col slds-size_1-of-2 slds-p-bottom_small">
                    <strong>Order Name:</strong> {data.Name}
                </div>

                <div class="slds-col slds-size_1-of-2 slds-p-bottom_small">
                    <strong>Supplier:</strong> {supplierName}
                </div>

                <div class="slds-col slds-size_1-of-2 slds-p-bottom_small">
                    <strong>Status:</strong> {data.Status__c}
                </div>

                <div class="slds-col slds-size_1-of-2">
                    <strong>Total Cost:</strong>
                    <lightning-formatted-number
                        value={data.Total_Cost__c}
                        format-style="currency">
                    </lightning-formatted-number>
                </div>

            </div>
        </template>
    </lightning-card>

    <!-- Purchase Order Line Items Card -->
    <div class="slds-p-around_medium slds-m-top_medium slds-card">

        <div class="slds-grid slds-grid_align-spread slds-m-bottom_small">
            <h2 class="slds-text-heading_medium">
                Purchase Order Line Items
            </h2>

            <lightning-button
                label="New"
                variant="brand"
                onclick={handleNewLineItem}>
            </lightning-button>
        </div>

        <!-- Line Items Datatable -->
        <template if:true={hasLineItems}>
            <lightning-datatable
                key-field="Id"
                data={lineItems}
                columns={lineItemColumns}
                hide-checkbox-column>
            </lightning-datatable>
        </template>

        <!-- Empty State -->
        <template if:false={hasLineItems}>
            <p class="slds-text-align_center slds-text-color_weak slds-p-around_medium">
                No line items attached to this purchase order yet.
            </p>
        </template>

    </div>

    <!-- Purchase Order Line Item Modal -->
    <template if:true={isModalOpen}>
        <c-purchase-order-line-item
            purchase-order-id={recordId}
            onclose={closeModal}
            onsaved={handleLineItemsSaved}>
        </c-purchase-order-line-item>
    </template>
</template>
