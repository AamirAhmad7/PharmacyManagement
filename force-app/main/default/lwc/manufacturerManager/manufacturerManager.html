<template>
    <lightning-card title="Manufacturers">
        <div class="slds-p-around_medium">
            <lightning-button variant="brand" label="New Manufacturer" onclick={openModal}></lightning-button>
        </div>

        <template if:true={manufacturers}>
            <lightning-datatable 
                key-field="Id" 
                data={manufacturers} 
                columns={columns} 
                onrowaction={handleRowAction}>
            </lightning-datatable>
        </template>
    </lightning-card>

    <!-- Modal -->
    <template if:true={isModalOpen}>
        <section role="dialog" tabindex="-1" aria-modal="true" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <lightning-button-icon icon-name="utility:close" alternative-text="Close" onclick={closeModal} class="slds-modal__close"></lightning-button-icon>
                    <h2 class="slds-modal__title slds-hyphenate">{modalTitle}</h2>
                </header>

                <div class="slds-modal__content slds-p-around_medium">
                    <lightning-input type="text" label="Name" name="manufacturerName" value={manufacturerName} onchange={handleChange}></lightning-input>
                    <lightning-input type="text" label="Contact Person" name="contactPerson" value={contactPerson} onchange={handleChange}></lightning-input>
                    <lightning-input type="tel" label="Phone" name="phone" value={phone} onchange={handleChange}></lightning-input>
                    <lightning-input type="email" label="Email" name="email" value={email} onchange={handleChange}></lightning-input>
                    <lightning-input type="text" label="License Number" name="licenseNumber" value={licenseNumber} onchange={handleChange}></lightning-input>
                </div>

                <footer class="slds-modal__footer">
                    <lightning-button label="Cancel" onclick={closeModal}></lightning-button>
                    <lightning-button label="Save" variant="brand" onclick={saveRecord} class="slds-m-left_small"></lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
    </template>
</template>
